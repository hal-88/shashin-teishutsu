<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>写真ていしゅつ</title>
<style>
  :root{
    --bg:#f6f3ec; --card:#fff; --ink:#2a2723; --sub:#77706a; --line:#e3dccf;
    --main:#2f6f8f; --main-dark:#1f5069; --main-soft:#e3f0f6;
    --ok:#2f7d4f; --ok-soft:#e3f3e8; --err:#b8402f; --err-soft:#fbe7e3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Meiryo",system-ui,sans-serif;
    -webkit-text-size-adjust:100%}
  body{padding:16px 16px 80px}
  .wrap{max-width:820px;margin:0 auto}
  h1{margin:0 0 14px;font-size:clamp(24px,4.5vw,34px);letter-spacing:.05em;
    border-bottom:3px solid var(--main);padding-bottom:8px}
  .demo{background:#fff6dc;color:#8a6200;border:1px dashed #d9b75a;border-radius:10px;
    padding:8px 12px;font-size:13px;margin-bottom:14px}

  .step{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px 16px;margin-bottom:14px}
  .step h2{margin:0 0 12px;font-size:20px;display:flex;align-items:center;gap:10px}
  .step h2 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;
    background:var(--main);color:#fff;font-size:17px}
  .step h2 .pick{margin-left:auto;font-size:16px;color:var(--main);font-weight:bold}

  .classes{display:flex;gap:12px;flex-wrap:wrap}
  .classes button{flex:1 1 140px;font:inherit;font-size:28px;font-weight:bold;padding:14px 0;border-radius:14px;
    border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
  .nums button{font:inherit;font-size:24px;font-weight:bold;height:58px;border-radius:12px;
    border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
  .classes button.on,.nums button.on{background:var(--main);border-color:var(--main);color:#fff}

  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .slot{position:relative;display:block;aspect-ratio:4/3;border:3px dashed #c9bfb0;border-radius:14px;
    background:#faf8f3;cursor:pointer;overflow:hidden}
  .slot input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .slot .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;color:var(--sub);pointer-events:none;text-align:center;padding:6px}
  .slot .k{font-weight:bold;font-size:16px}
  .slot .plus{font-size:44px;line-height:1;color:var(--main)}
  .slot .m{font-size:13px}
  .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#eee;pointer-events:none;display:none}
  .slot.has{border-style:solid;border-color:var(--main)}
  .slot.has img{display:block}
  .slot.has .in{display:none}
  .slot .tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:bold;
    border-radius:8px;padding:2px 8px;pointer-events:none;display:none}
  .slot.has .tag{display:block}
  .slot.busy .in .plus{animation:spin 1s linear infinite;display:inline-block}
  .slot.bad{border-color:var(--err)}
  .slot.bad .m{color:var(--err);font-weight:bold}
  .note{font-size:14px;color:var(--sub);margin:10px 0 0}

  #send{display:block;width:100%;font:inherit;font-size:30px;font-weight:bold;padding:18px 0;border:none;border-radius:18px;
    background:var(--main);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--main-dark);margin-top:6px}
  #send:active{transform:translateY(3px);box-shadow:0 2px 0 var(--main-dark)}
  #send:disabled{background:#c9c1b7;box-shadow:0 5px 0 #a99f94;cursor:default;transform:none}
  #hint{text-align:center;color:var(--sub);font-size:16px;margin:12px 0 0;min-height:1.5em}
  #err{display:none;background:var(--err-soft);color:var(--err);border-radius:14px;padding:12px 16px;
    font-size:18px;font-weight:bold;margin-top:14px}

  dialog{border:none;border-radius:20px;padding:24px;max-width:min(92vw,480px);width:100%;color:var(--ink);
    box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(30,25,20,.45)}
  dialog h3{margin:0 0 10px;font-size:26px;text-align:center}
  dialog .who{font-size:34px;font-weight:bold;text-align:center;color:var(--main);margin:6px 0 10px}
  dialog p{margin:0 0 18px;font-size:16px;color:var(--sub);text-align:center;line-height:1.6}
  .dbtns{display:flex;gap:12px}
  .dbtns button{flex:1;font:inherit;font-size:22px;font-weight:bold;padding:14px 0;border-radius:14px;cursor:pointer}
  .dbtns .yes{background:var(--main);color:#fff;border:none}
  .dbtns .no{background:#fff;color:var(--ink);border:2px solid var(--line)}

  .cover{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;padding:24px;text-align:center;z-index:10}
  .cover.show{display:flex}
  .spinner{width:64px;height:64px;border-radius:50%;border:7px solid var(--main-soft);border-top-color:var(--main);
    animation:spin 1s linear infinite}
  .cover .big{font-size:30px;font-weight:bold}
  .cover .small{font-size:16px;color:var(--sub)}
  .check{width:110px;height:110px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;
    font-size:64px;font-weight:bold}
  #doneWho{font-size:28px;font-weight:bold;color:var(--ok)}
  .thumbs{display:flex;gap:8px;justify-content:center}
  .thumbs img{width:min(26vw,170px);aspect-ratio:4/3;object-fit:contain;background:#e8e4dc;border-radius:8px}
  #again{font:inherit;font-size:20px;font-weight:bold;padding:12px 26px;border-radius:14px;border:2px solid var(--main);
    background:#fff;color:var(--main);cursor:pointer;margin-top:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:520px){
    .slots{grid-template-columns:1fr}
    .slot{aspect-ratio:16/9}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 写真ていしゅつ</h1>
  <div id="demo" class="demo" hidden>デモモード：Firebaseが未設定なので、写真はこの端末の中だけに保存されます。</div>

  <section class="step">
    <h2><span class="n">1</span>クラス<span class="pick" id="pickCls"></span></h2>
    <div class="classes" id="classes"></div>
  </section>

  <section class="step">
    <h2><span class="n">2</span>出席番号<span class="pick" id="pickNo"></span></h2>
    <div class="nums" id="nums"></div>
  </section>

  <section class="step">
    <h2><span class="n">3</span>写真を3まい えらぶ</h2>
    <div class="slots" id="slots"></div>
    <p class="note">わくをタップすると写真をえらべます。まちがえたら、もう一度タップして えらびなおしてね。</p>
  </section>

  <button id="send" disabled>送る</button>
  <p id="hint"></p>
  <div id="err"></div>
</div>

<dialog id="confirm">
  <h3>この番号で送ります</h3>
  <div class="who" id="confirmWho"></div>
  <p>前にも送っていたら、<br>今回の写真に入れかわります。</p>
  <div class="dbtns">
    <button class="no" id="cNo">もどる</button>
    <button class="yes" id="cYes">送る</button>
  </div>
</dialog>

<div class="cover" id="sending">
  <div class="spinner"></div>
  <div class="big">送っています…</div>
  <div class="small">画面をとじないで、少し待ってね</div>
</div>

<div class="cover" id="done">
  <div class="check">✓</div>
  <div class="big">送れました！</div>
  <div id="doneWho"></div>
  <div class="thumbs" id="doneThumbs"></div>
  <button id="again">写真をえらびなおして送る</button>
</div>

<script type="module">
import { CLASSES, PHOTO_COUNT, configured, compressImage, backend } from "./common.js";

const $ = id => document.getElementById(id);
const LAST = "shashin-teishutsu-last";
const st = { cls: null, no: null, photos: Array(PHOTO_COUNT).fill(null), busy: Array(PHOTO_COUNT).fill(false), urls: Array(PHOTO_COUNT).fill(null) };

if (!configured) $("demo").hidden = false;
try {
  const last = JSON.parse(localStorage.getItem(LAST) || "null");
  if (last && CLASSES.some(c => c.id === last.cls)) { st.cls = last.cls; st.no = last.no; }
} catch (e) {}

const clsInfo = () => CLASSES.find(c => c.id === st.cls);
function remember() { try { localStorage.setItem(LAST, JSON.stringify({ cls: st.cls, no: st.no })); } catch (e) {} }

/* ---- クラス ---- */
function renderClasses() {
  $("classes").innerHTML = "";
  CLASSES.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c.id;
    b.className = c.id === st.cls ? "on" : "";
    b.onclick = () => {
      st.cls = c.id;
      if (st.no && st.no > c.count) st.no = null;
      remember(); renderClasses(); renderNums(); update();
    };
    $("classes").appendChild(b);
  });
  $("pickCls").textContent = st.cls || "";
}
/* ---- 番号 ---- */
function renderNums() {
  const max = clsInfo() ? clsInfo().count : Math.max(...CLASSES.map(c => c.count));
  $("nums").innerHTML = "";
  for (let n = 1; n <= max; n++) {
    const b = document.createElement("button");
    b.textContent = n;
    b.className = n === st.no ? "on" : "";
    b.onclick = () => { st.no = n; remember(); renderNums(); update(); };
    $("nums").appendChild(b);
  }
  $("pickNo").textContent = st.no ? st.no + "番" : "";
}
/* ---- 写真 ---- */
const slotEls = [];
function buildSlots() {
  for (let i = 0; i < PHOTO_COUNT; i++) {
    const el = document.createElement("label");
    el.className = "slot";
    el.innerHTML = `<input type="file" accept="image/*" multiple>
      <div class="in"><span class="k">${i + 1}まいめ</span><span class="plus">＋</span><span class="m">タップしてえらぶ</span></div>
      <img alt=""><span class="tag">${i + 1}</span>`;
    const input = el.querySelector("input");
    input.addEventListener("change", () => {
      const files = [...input.files];
      input.value = "";
      // まとめて選んだら、となりのわくにも順番に入れる
      files.slice(0, PHOTO_COUNT - i).forEach((f, k) => setPhoto(i + k, f));
    });
    $("slots").appendChild(el);
    slotEls.push(el);
  }
}
async function setPhoto(i, file) {
  const el = slotEls[i];
  st.busy[i] = true;
  st.photos[i] = null;
  el.classList.remove("has", "bad");
  el.classList.add("busy");
  el.querySelector(".m").textContent = "じゅんび中…";
  update();
  try {
    const p = await compressImage(file);
    st.photos[i] = p;
    if (st.urls[i]) URL.revokeObjectURL(st.urls[i]);
    st.urls[i] = URL.createObjectURL(p.blob);
    el.querySelector("img").src = st.urls[i];
    el.classList.add("has");
  } catch (e) {
    el.classList.add("bad");
    el.querySelector(".m").textContent = "この写真は使えません。べつの写真をえらんでね";
  } finally {
    st.busy[i] = false;
    el.classList.remove("busy");
    if (!el.classList.contains("bad")) el.querySelector(".m").textContent = "タップしてえらぶ";
    update();
  }
}
window.__setPhoto = setPhoto; // 動作確認用

/* ---- 送るボタン ---- */
function update() {
  const left = st.photos.filter(p => !p).length;
  let hint = "";
  if (!st.cls) hint = "クラスをえらんでね";
  else if (!st.no) hint = "出席番号をえらんでね";
  else if (st.busy.some(Boolean)) hint = "写真をじゅんびしています…";
  else if (left) hint = `写真をあと ${left}まい えらんでね`;
  $("hint").textContent = hint;
  $("send").disabled = !!hint;
  $("err").style.display = "none";
}

$("send").onclick = () => {
  $("confirmWho").textContent = `${st.cls}　${st.no}番`;
  $("confirm").showModal();
};
$("cNo").onclick = () => $("confirm").close();
$("cYes").onclick = async () => {
  $("confirm").close();
  $("sending").classList.add("show");
  try {
    await backend.submit(st.cls, st.no, st.photos);
    $("doneWho").textContent = `${st.cls}　${st.no}番`;
    $("doneThumbs").innerHTML = st.urls.map(u => `<img src="${u}" alt="">`).join("");
    $("done").classList.add("show");
  } catch (e) {
    console.error(e);
    const msg = e && e.message === "timeout"
      ? "送れませんでした。電波が弱いかもしれません。もう一度「送る」を押してね。"
      : (e && e.code === "permission-denied")
        ? "送れませんでした（設定のエラー）。先生に知らせてね。"
        : "送れませんでした。もう一度「送る」を押してね。直らなかったら先生に知らせてね。";
    $("err").textContent = msg;
    $("err").style.display = "block";
  } finally {
    $("sending").classList.remove("show");
  }
};
$("again").onclick = () => {
  st.photos.fill(null);
  slotEls.forEach(el => { el.classList.remove("has", "bad"); el.querySelector("img").removeAttribute("src"); });
  st.urls.forEach(u => u && URL.revokeObjectURL(u));
  st.urls.fill(null);
  $("done").classList.remove("show");
  update();
  scrollTo(0, 0);
};

renderClasses(); renderNums(); buildSlots(); update();
</script>
</body>
</html>
